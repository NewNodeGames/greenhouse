android.useAndroidX=true
android.prefabVersion=2.1.0

kotlin.code.style=official

org.gradle.jvmargs=-Xmx2560M -XX:+UseParallelGC

org.gradle.caching=true
org.gradle.configureondemand=true

android.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled

android.enableR8.fullMode=true

# ABIs the native code is built for and the app packages (comma-separated): arm64-v8a, armeabi-v7a, x86, x86_64.
# 64-bit ARM only, for now: no 32-bit ARM, and no x86 (emulators and Chromebooks on x86).
greenhouse.abis=arm64-v8a
