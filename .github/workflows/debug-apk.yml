name: Debug APK

# Builds the debug APK of the branch you name and keeps it as a download of the run (Actions tab > the
# run > Artifacts). Run it by hand from main: "Run workflow", then type the exact name of the branch.
# If the name does not exist the run fails at once and its log lists the branches that do.
# It publishes nothing.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Exact name of the branch to build
        required: true

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check that the branch exists
        env:
          BRANCH: ${{ inputs.branch }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" "$BRANCH" > /dev/null; then
            echo "Found the branch $BRANCH"
          else
            echo "There is no branch called '$BRANCH'. The branches are:"
            git ls-remote --heads "$REPO_URL" | sed 's#.*refs/heads/#  #'
            exit 1
          fi

      - name: Checkout the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
          fetch-depth: 0

      - name: Show what is being built
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git log -1 --format="Building %h on $BRANCH - %s"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK & CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: greenhouse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
